[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-ai-discovery"
version = "0.1.0"
description = "AWS AI Discovery Agent - Read-Only Cloud AI Inventory and Governance POC"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Cloud AI Governance Team" }
]
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.2.0",
    "streamlit>=1.35.0",
    "pytest>=8.2.0",
    "python-dotenv>=1.0.1",
    "tabulate>=0.9.0",
    "click>=8.1.0"
]

[project.scripts]
aws-ai-discovery = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
